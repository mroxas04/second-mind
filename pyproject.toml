[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "second-mind"
version = "0.1.0"
description = "A local-first personal journal system"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
second-mind = "second_mind.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.4"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
